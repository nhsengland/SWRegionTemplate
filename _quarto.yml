  # google-analytics: "G-5CB82FGFDJ"
  site-url: "https://github.com/nhsengland/SW_ways_of_working"
  sidebar:
    foreground: "black"
    # background: "#EBF5FF"
    background: "#005eb833"
    style: "docked"
    search: true
    contents:
      - section: "Analytical Process"
        contents:
          - index.qmd
          - start_process.qmd
          - analytical_question.qmd
          - qa_start.qmd
          - dq_issues.qmd
          - prov_insights.qmd
          - qa_data.qmd
          - review.qmd
          - qa_output.qmd
      - section: "Coding standards"
        contents:      
          - code_prin_overview.qmd
          - git_train.qmd
          - Code_QA.qmd
          - git_temp.qmd
      - section: "About"
        contents:
          - about.qmd
          - accessibility.qmd
          - ts-and-cs.qmd
          - LICENCE.qmd
          - contact.qmd
    tools: 
      - icon: github
        menu: 
          - text: Source Code
            href: https://github.com/nhsengland/SW_ways_of_working
          - text: Report a bug / suggestions
            href: https://github.com/nhsengland/SW_ways_of_working/issues


  page-footer:
