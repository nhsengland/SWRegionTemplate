       South West Insights and Intelligence &#8729; Made with [![Quarto](https://quarto.org/quarto.png){fig-alt="Quarto logo blue round circle with a cross within the circumference" width=65px}](https://quarto.org/)
  # The now year is from a Quarto extension https://www.garrickadenbuie.com/blog/quarto-now/
      center: 
         Make a suggestion / Report a bug <a href="https://github.com/nhsengland/SW_ways_of_working" aria-label="Go to SW I&I GitHub" title="github" target="_blank" rel="noopener">
          <i class="link-dark me-1" aria-hidden="true"></i> {{< fa brands github >}}</a>
  
      right:
        - text: "Accessibility"
          href: accessibility.qmd
          aria-label: Accessibility Commitment
        - text: "Terms and Conditions"
